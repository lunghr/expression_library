name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  unit-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run core unit tests
        run: npm run test --workspace @expression-editor/core

  unit-adapters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build core package
        run: npm run build --workspace @expression-editor/core

      - name: Run adapters unit tests
        run: npx vitest run tests/metadata-provider.test.ts tests/expression-transport.test.ts tests/root-bindings.test.ts --pool vmThreads
        working-directory: packages/adapters

  integration-adapters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build core package
        run: npm run build --workspace @expression-editor/core

      - name: Build adapters package
        run: npm run build --workspace @expression-editor/adapters

      - name: Run adapters integration tests
        run: npx vitest run tests/host-application.test.ts tests/integration-flow.test.ts tests/architecture-boundaries.test.ts --pool vmThreads
        working-directory: packages/adapters

  build-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build core package
        run: npm run build --workspace @expression-editor/core

      - name: Build UI package
        run: npm run build --workspace @expression-editor/ui

  build-demo-playground:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install demo playground dependencies
        run: npm install
        working-directory: apps/demo-playground

      - name: Build demo playground
        run: npm run build
        working-directory: apps/demo-playground

  e2e-demo:
    runs-on: ubuntu-latest
    needs:
      - unit-core
      - unit-adapters
      - integration-adapters
      - build-ui
      - build-demo-playground

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install demo playground dependencies
        run: npm install
        working-directory: apps/demo-playground

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
